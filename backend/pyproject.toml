[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
# --ds, because a DJANGO_SETTINGS_MODULE variable in the shell would beat the ini option.
addopts = "--reuse-db --ds=config.settings.test"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["**/migrations/*", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403"]
